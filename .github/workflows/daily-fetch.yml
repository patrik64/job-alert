name: daily fetch

on:
  schedule:
    # cron runs in UTC while 4am Central European time moves with DST, so
    # both candidate hours fire and the guard keeps whichever is 4am local;
    # :02 rather than :00 because github's scheduler is most congested on
    # the hour and has started runs ten hours late from there
    - cron: '2 2 * * *'
    - cron: '2 3 * * *'
  workflow_dispatch:
    inputs:
      announce_only:
        description: 'skip the refresh, just announce the current newcomers'
        type: boolean
        default: false

concurrency:
  group: daily-fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    # dozens of boards are listed one after the other, the largest taking a
    # few minutes each, and the night's newcomers get their descriptions after
    timeout-minutes: 120
    steps:
      - id: guard
        name: only the 4am CET/CEST schedule
        run: |
          # judged by which cron fired, never by the clock: github often
          # starts a scheduled run an hour or more late, which once made a
          # run-time hour check skip every night
          offset=$(TZ=Europe/Berlin date +%z)
          want='2 3 * * *'
          [ "$offset" = "+0200" ] && want='2 2 * * *'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "the '${{ github.event.schedule }}' schedule is not 4am in Berlin (utc offset $offset) — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - if: steps.guard.outputs.run == 'true' && github.event.inputs.announce_only != 'true'
        name: refresh every fund
        run: node scripts/fetch-all.mjs

      # a night where too many scrapers broke still found jobs worth
      # announcing, so this runs even when the refresh above reports failure
      - if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        name: announce the rust jobs on bluesky
        env:
          BLUESKY_IDENTIFIER: rust-job-alert.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_RUST_APP_PASSWORD }}
          # by hand, the announcement covers every standing rust newcomer
          # rather than one run's findings
          MODE: ${{ github.event.inputs.announce_only == 'true' && '--current' || '' }}
        run: node scripts/post-rust-jobs.mjs $MODE
